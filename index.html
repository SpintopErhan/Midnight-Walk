
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Midnight Walk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Creepster', cursive;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            height: 100vh;
            width: 100vw;
        }
        #root {
            height: 100%;
            width: 100%;
        }
        canvas {
            display: block;
        }
        .font-creepster {
            font-family: 'Creepster', cursive;
        }
        /* Mobile height fix */
        .h-screen-dynamic {
            height: 100vh;
            height: 100dvh;
        }

        /* Portrait Warning Overlay */
        #orientation-warning {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            text-align: center;
            padding: 2rem;
            cursor: pointer;
        }

        /* Only show if control mode is touch AND in portrait */
        .mobile-touch-mode #orientation-warning {
            display: flex;
        }

        @media (orientation: landscape) {
            .mobile-touch-mode #orientation-warning {
                display: none;
            }
        }
        
        .rotate-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: rotateDevice 2s ease-in-out infinite;
        }

        @keyframes rotateDevice {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        .tap-hint {
            margin-top: 20px;
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            letter-spacing: 0.3em;
            color: rgba(255,255,255,0.3);
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    
    <!-- Portrait Warning -->
    <div id="orientation-warning" onclick="window.requestGameFullscreen()">
        <svg class="rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <path d="M12 18h.01"></path>
        </svg>
        <h2 class="font-creepster text-3xl mb-2 uppercase tracking-widest">Landscape Required</h2>
        <p class="font-inter text-xs text-white/40 uppercase tracking-[0.2em]">Please rotate your device to play</p>
        <div class="tap-hint">Tap screen to enable fullscreen</div>
    </div>

    <script type="module" src="./index.tsx"></script>
</body>
</html>
